name: Build and Test

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CCACHE_DIR: ${{ github.workspace }}/.ccache

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format and clang-tidy
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/bin/clang-tidy

      - name: Check clang-format
        run: |
          # Check if there are any C++ source files to format
          if find . -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" -o -name "*.cc" \) | grep -q .; then
            echo "Running clang-format check..."
            find . -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" -o -name "*.cc" \) \
              -not -path "./build/*" -not -path "./third_party/*" -not -path "./_deps/*" \
              -print0 | xargs -0 clang-format --dry-run --Werror
          else
            echo "No C++ source files found. Skipping clang-format check."
          fi

      - name: Run clang-tidy
        run: |
          # Check if there are any C++ source files to lint
          if find . -type f \( -name "*.cpp" -o -name "*.cc" \) | grep -q .; then
            echo "Running clang-tidy check..."
            # This will be enabled once we have a compile_commands.json
            echo "clang-tidy will be enabled once CMake build is set up"
          else
            echo "No C++ source files found. Skipping clang-tidy check."
          fi

      - name: Install yamllint
        run: |
          pip install --user yamllint

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."
          yamllint . || echo "YAML validation found issues (see above)"

      - name: Install actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv ./actionlint /usr/local/bin/

      - name: Validate GitHub Actions workflows
        run: |
          echo "Validating GitHub Actions workflows..."
          actionlint .github/workflows/*.yml

  build:
    name: Build (${{ matrix.compiler.name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc, version: 14, cc: gcc-14, cxx: g++-14 }
          - { name: clang, version: 18, cc: clang-18, cxx: clang++-18 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            build/_deps
          key: >-
            ${{ runner.os }}-${{ matrix.compiler.name }}-${{
            matrix.compiler.version }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}-
            ${{ runner.os }}-${{ matrix.compiler.name }}-

      - name: Install dependencies
        run: |
          sudo apt-get update

          # Install build tools
          sudo apt-get install -y \
            cmake \
            ninja-build \
            ccache \
            git

          # Install compilers
          if [ "${{ matrix.compiler.name }}" = "gcc" ]; then
            # GCC 14 is available in Ubuntu 24.04 default repos
            sudo apt-get install -y ${{ matrix.compiler.cxx }}
          else
            # Install Clang 18 from LLVM repository
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
            sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main"
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.compiler.cxx }}

            # Install libc++ for optimal C++23 support
            sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          fi

          # Verify installations
          cmake --version
          ninja --version
          ${{ matrix.compiler.cxx }} --version

      - name: Configure CMake (CI toolchain)
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          echo "Configuring with CI-safe toolchain..."
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ci.cmake \
            -DCMAKE_CXX_COMPILER="${{ matrix.compiler.cxx }}" \
            -DCMAKE_C_COMPILER="${{ matrix.compiler.cc }}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          if [ -f "build/build.ninja" ] || [ -f "build/Makefile" ]; then
            echo "Building project..."
            cmake --build build --config ${{ env.BUILD_TYPE }} -j "$(nproc)"
          else
            echo "No build files generated. Skipping build step."
            echo "This is expected for a project without source code yet."
          fi

      - name: Run tests
        run: |
          if [ -f "build/build.ninja" ] || [ -f "build/Makefile" ]; then
            echo "Running tests..."
            cd build
            ctest --output-on-failure --build-config ${{ env.BUILD_TYPE }} || echo "No tests configured yet"
          else
            echo "No tests to run yet. Tests will be added as the project develops."
          fi

      - name: Upload build artifacts
        if: always() && matrix.compiler.name == 'clang'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.compiler.name }}-${{ matrix.compiler.version }}
          path: |
            build/horcrux*
            build/**/*.a
            build/**/*.so
            build/compile_commands.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Show ccache statistics
        run: |
          ccache --show-stats || echo "ccache statistics not available"

  status:
    name: CI Status
    runs-on: ubuntu-latest
    permissions: {}
    needs: [lint, build]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ Some CI checks failed"
            echo "Lint: ${{ needs.lint.result }}"
            echo "Build: ${{ needs.build.result }}"
            exit 1
          fi

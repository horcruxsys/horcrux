# Lefthook Configuration for Horcrux
# Pre-commit and pre-push hooks for code quality, formatting, and validation
# See: https://github.com/evilmartians/lefthook

# Pre-commit hook: formatting and validation
pre-commit:
  parallel: true
  commands:
    # Format ALL C++ code with clang-format-18
    format-cpp:
      run: |
        if command -v clang-format-18 >/dev/null 2>&1; then
          echo "🎨 Formatting C++ code with clang-format-18..."
          find . -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" -o -name "*.cc" \) \
            -not -path "./build/*" -not -path "./third_party/*" -not -path "./_deps/*" \
            -print0 | xargs -0 clang-format-18 -i
          git add -A
        elif command -v clang-format >/dev/null 2>&1; then
          echo "🎨 Formatting C++ code with clang-format (fallback)..."
          find . -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" -o -name "*.cc" \) \
            -not -path "./build/*" -not -path "./third_party/*" -not -path "./_deps/*" \
            -print0 | xargs -0 clang-format -i
          git add -A
        else
          echo "⚠️  clang-format not found, install with: sudo apt install clang-format-18"
          echo "❌ Code formatting required for commit"
          exit 1
        fi
      stage_fixed: true

    # Validate YAML files
    validate-yaml:
      glob: "*.{yml,yaml}"
      exclude: '(^build/|^third_party/)'
      run: |
        if command -v yamllint >/dev/null 2>&1; then
          yamllint {staged_files}
        else
          echo "⚠️  yamllint not found, install with: sudo apt install yamllint"
          echo "ℹ️  Skipping YAML validation..."
        fi

    # Check for common issues in commit
    check-merge-conflicts:
      glob: "*"
      run: |
        if grep -r '<''<<<<<<< HEAD' {staged_files} 2>/dev/null; then
          echo "❌ Error: Found merge conflict markers in staged files"
          exit 1
        fi

    # Check for TODO/FIXME without context
    check-todos:
      glob: "*.{cpp,hpp,h,cc,yml,yaml,md}"
      run: |
        # Allow TODOs with context (name, issue number, etc.)
        # Flag bare TODOs without explanation
        if grep -E "TODO(?!.*\()" {staged_files} 2>/dev/null | grep -v "TODO("; then
          echo "⚠️  Warning: Found TODO without context. Please add context like TODO(username) or TODO(#issue)"
        fi

# Pre-push hook: build validation with both GCC and Clang
pre-push:
  parallel: false
  commands:
    # Build with GCC using CI toolchain
    build-gcc:
      run: |
        echo "🔨 Building with GCC (CI toolchain)..."
        if command -v gcc >/dev/null 2>&1; then
          export CC=gcc CXX=g++
          cmake -B build-gcc-ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ci.cmake
          cmake --build build-gcc-ci -j $(nproc)
          echo "✅ GCC build successful!"
        else
          echo "❌ GCC not found, install with: sudo apt install build-essential"
          exit 1
        fi

    # Build with Clang using CI toolchain
    build-clang:
      run: |
        echo "🔨 Building with Clang (CI toolchain)..."
        if command -v clang-18 >/dev/null 2>&1; then
          export CC=clang-18 CXX=clang++-18
          cmake -B build-clang-ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ci.cmake
          cmake --build build-clang-ci -j $(nproc)
          echo "✅ Clang build successful!"
        elif command -v clang >/dev/null 2>&1; then
          echo "🔨 Using fallback clang..."
          export CC=clang CXX=clang++
          cmake -B build-clang-ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ci.cmake
          cmake --build build-clang-ci -j $(nproc)
          echo "✅ Clang build successful!"
        else
          echo "❌ Clang not found, install with: sudo apt install clang-18"
          exit 1
        fi

    # Run tests with GCC build
    run-tests:
      run: |
        echo "🧪 Running tests..."
        cd build-gcc-ci
        if command -v ctest >/dev/null 2>&1; then
          ctest --output-on-failure -j $(nproc) || echo "⚠️  Some tests failed or no tests configured"
        else
          echo "ℹ️  CTest not available, skipping tests"
        fi
        echo "✅ All validation steps completed!"

# Skip hook configuration
# Users can skip hooks with: LEFTHOOK=0 git commit
skip_output:
  - meta
  - summary

# Output configuration
output:
  - execution
  - success
  - failure
